name: Windows V1.4

on:
  push:
    branches: [ "main", "feature/**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: metropole-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-package:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build simulation
        shell: pwsh
        run: dotnet build src/Metropole.Sim/Metropole.Sim.csproj -c Release

      - name: Run headless simulation tests
        shell: pwsh
        run: dotnet run --project tests/Metropole.SimTests/Metropole.SimTests.csproj -c Release

      - name: Download Godot .NET and export templates
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "4.7.2"
          $tag = "$version-stable"
          New-Item -ItemType Directory -Force -Path .toolcache/godot,.toolcache/templates | Out-Null
          Invoke-WebRequest "https://github.com/godotengine/godot/releases/download/$tag/Godot_v$($tag)_mono_win64.zip" -OutFile .toolcache/godot.zip
          Invoke-WebRequest "https://github.com/godotengine/godot/releases/download/$tag/Godot_v$($tag)_mono_export_templates.tpz" -OutFile .toolcache/templates.tpz
          Expand-Archive .toolcache/godot.zip .toolcache/godot -Force
          Expand-Archive .toolcache/templates.tpz .toolcache/templates -Force
          $godot = Get-ChildItem .toolcache/godot -Recurse -Filter "*mono_win64_console.exe" | Select-Object -First 1
          if (!$godot) { throw "Godot .NET executable not found" }
          "GODOT_EXE=$($godot.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          $templateTarget = Join-Path $env:APPDATA "Godot\export_templates\$version.stable.mono"
          New-Item -ItemType Directory -Force -Path $templateTarget | Out-Null
          Copy-Item ".toolcache/templates/templates/*" $templateTarget -Recurse -Force

      - name: Build Godot C# project
        shell: pwsh
        run: dotnet build src/Metropole.Game/Metropole.Game.csproj -c Release

      - name: Import project and assets
        shell: pwsh
        run: '& "$env:GODOT_EXE" --headless --path src/Metropole.Game --editor --quit'

      - name: Export Windows
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build | Out-Null
          & "$env:GODOT_EXE" --headless --path src/Metropole.Game --export-release Windows "$pwd/build/Metropole.exe"
          if ($LASTEXITCODE -ne 0) { throw "Godot export failed: $LASTEXITCODE" }
          if (!(Test-Path build/Metropole.exe)) { throw "Metropole.exe not produced" }

      - name: Validate exported gameplay UI - automatic renderer
        shell: pwsh
        run: |
          $env:METROPOLE_UI_VALIDATION = "1"
          $stdout = Join-Path $pwd "ui-validation-auto.out"
          $stderr = Join-Path $pwd "ui-validation-auto.err"
          $proc = Start-Process -FilePath "$pwd/build/Metropole.exe" -ArgumentList "--headless","--quit-after","1200" -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
          if (!$proc.WaitForExit(45000)) {
            Stop-Process -Id $proc.Id -Force
            throw "Automatic renderer UI validation timed out after 45 seconds"
          }
          $joined = ((Get-Content $stdout -Raw -ErrorAction SilentlyContinue) + "`n" + (Get-Content $stderr -Raw -ErrorAction SilentlyContinue))
          Write-Host $joined
          if ($proc.ExitCode -ne 0) { throw "Automatic renderer UI validation failed with exit code $($proc.ExitCode)" }
          if ($joined -notmatch "METROPOLE_UI_VALIDATION_OK") { throw "Automatic renderer UI success marker was not produced" }
          if ($joined -notmatch "METROPOLE_ASSET_VALIDATION_OK") { throw "External asset validation success marker was not produced" }

      - name: Validate premium city structure on Compatibility
        shell: pwsh
        run: |
          $env:METROPOLE_UI_VALIDATION = "1"
          $env:METROPOLE_FORCE_PREMIUM = "1"
          $stdout = Join-Path $pwd "ui-validation-premium.out"
          $stderr = Join-Path $pwd "ui-validation-premium.err"
          $proc = Start-Process -FilePath "$pwd/build/Metropole.exe" -ArgumentList "--headless","--rendering-method","gl_compatibility","--quit-after","1200" -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
          if (!$proc.WaitForExit(45000)) {
            Stop-Process -Id $proc.Id -Force
            throw "Premium city validation timed out after 45 seconds"
          }
          $joined = ((Get-Content $stdout -Raw -ErrorAction SilentlyContinue) + "`n" + (Get-Content $stderr -Raw -ErrorAction SilentlyContinue))
          Write-Host $joined
          if ($proc.ExitCode -ne 0) { throw "Premium city structure validation failed with exit code $($proc.ExitCode)" }
          if ($joined -notmatch "METROPOLE_UI_VALIDATION_OK") { throw "Premium city success marker was not produced" }

      - name: Validate lightweight 2D fallback
        shell: pwsh
        run: |
          $env:METROPOLE_UI_VALIDATION = "1"
          $env:METROPOLE_FORCE_FALLBACK = "1"
          $stdout = Join-Path $pwd "ui-validation-fallback.out"
          $stderr = Join-Path $pwd "ui-validation-fallback.err"
          $proc = Start-Process -FilePath "$pwd/build/Metropole.exe" -ArgumentList "--headless","--rendering-method","gl_compatibility","--quit-after","1200" -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
          if (!$proc.WaitForExit(45000)) {
            Stop-Process -Id $proc.Id -Force
            throw "2D fallback validation timed out after 45 seconds"
          }
          $joined = ((Get-Content $stdout -Raw -ErrorAction SilentlyContinue) + "`n" + (Get-Content $stderr -Raw -ErrorAction SilentlyContinue))
          Write-Host $joined
          if ($proc.ExitCode -ne 0) { throw "2D fallback validation failed with exit code $($proc.ExitCode)" }
          if ($joined -notmatch "METROPOLE_UI_VALIDATION_OK") { throw "2D fallback success marker was not produced" }

      - name: Smoke launch exported game
        shell: pwsh
        run: |
          $game = Start-Process -FilePath "$pwd/build/Metropole.exe" -ArgumentList "--headless","--quit-after","120" -PassThru
          if (!$game.WaitForExit(15000)) { Stop-Process -Id $game.Id -Force }
          elseif ($game.ExitCode -ne 0) { throw "Exported game smoke test failed with $($game.ExitCode)" }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer/Metropole.iss
          if (!(Test-Path dist/Metropole-1.4.0-Setup.exe)) { throw "Installer not produced" }

      - name: Smoke install
        shell: pwsh
        run: |
          $target = Join-Path $env:LOCALAPPDATA "MetropoleCITest"
          $proc = Start-Process -FilePath "$pwd/dist/Metropole-1.4.0-Setup.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=$target" -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "Installer failed with $($proc.ExitCode)" }
          if (!(Test-Path "$target/Metropole.exe")) { throw "Installed executable not found" }
          $game = Start-Process -FilePath "$target/Metropole.exe" -ArgumentList "--headless","--quit-after","120" -PassThru
          if (!$game.WaitForExit(15000)) { Stop-Process -Id $game.Id -Force }
          elseif ($game.ExitCode -ne 0) { throw "Installed game smoke test failed with $($game.ExitCode)" }

      - name: Checksums
        shell: pwsh
        run: |
          Get-FileHash build/Metropole.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  Metropole.exe" } | Set-Content dist/SHA256SUMS.txt
          Get-FileHash dist/Metropole-1.4.0-Setup.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  Metropole-1.4.0-Setup.exe" } | Add-Content dist/SHA256SUMS.txt

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Metropole-1.4.0-Windows
          path: |
            build/**
            dist/Metropole-1.4.0-Setup.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
